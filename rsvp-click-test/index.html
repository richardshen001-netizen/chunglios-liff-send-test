<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSVP UX Test</title>
<style>body{margin:0;background:#e9ede8;color:#18211c;font:18px system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center}main{box-sizing:border-box;background:white;border-radius:20px;padding:28px 22px;width:calc(100% - 36px);max-width:410px;text-align:center;box-shadow:0 10px 35px #24392a18}h1{font-size:25px;margin:8px 0 24px}p{line-height:1.6}strong{color:#45694c}footer{display:flex;gap:12px;margin-top:28px}button{flex:1;padding:15px;border-radius:12px;border:1px solid #506054;background:white;font:inherit}#confirm{background:#45694c;color:white}button:disabled{opacity:.45}#status{min-height:28px;color:#45694c;overflow-wrap:anywhere}</style>
<style>body{font-size:15px}main{max-width:350px;padding:18px 20px;border-radius:16px}h1{font-size:19px;margin:0 0 12px}p{line-height:1.4;margin:10px 0}.event{font-weight:600;margin-bottom:3px}.date{font-size:13px;margin-top:0}footer{gap:10px;margin-top:14px}button{padding:10px}#status{min-height:0}#status:empty{display:none}#answer{display:inline-block;padding:5px 13px;border-radius:20px;margin-top:5px;color:#24392a}#answer[data-answer="attending"]{background:#DDEADB}#answer[data-answer="not_attending"]{background:#FBE5E1}#answer[data-answer="unsure"]{background:#F3EDDF}</style>
</head><body><main><h1>Confirm your response?</h1><p class="event">Regular Meeting</p><p class="date">Sep 25 (Fri) · 19:15–21:30</p><p>You selected:<br><strong id="answer"></strong></p><footer><button id="cancel">Cancel</button><button id="confirm" disabled>Confirm</button></footer><p id="status" role="status"></p></main>
<script>
const LIFF_ID='2011276672-KMcqYClm';
const labels={attending:'Attend',not_attending:'Not Attend',unsure:'Unsure'};
const status=document.getElementById('status'),confirmButton=document.getElementById('confirm');
let ready;
async function closeConfirmation(){
 try{await ready;if(window.liff?.isInClient())liff.closeWindow();else history.back();}
 catch(e){status.textContent=e.message||String(e);}
}
document.getElementById('cancel').onclick=closeConfirmation;
confirmButton.onclick=closeConfirmation;
function showAnswer(){
 const p=new URLSearchParams(location.search);
 const state=p.get('liff.state');
 const nested=state?new URL(state,location.origin).searchParams:null;
 const meeting=p.get('meeting')||nested?.get('meeting');
 const answer=p.get('answer')||nested?.get('answer');
 if(!['test-20260925','test-20261009'].includes(meeting)||!Object.hasOwn(labels,answer)){status.textContent='Test / Not implemented';return;}
 document.querySelector('.date').textContent=meeting==='test-20261009'?'Oct 9 (Fri) · 19:15–21:30':'Sep 25 (Fri) · 19:15–21:30';
 document.getElementById('answer').textContent=labels[answer];document.getElementById('answer').dataset.answer=answer;status.textContent='';confirmButton.disabled=false;
}
showAnswer();
ready=new Promise((resolve,reject)=>{
 const sdk=document.createElement('script');sdk.src='https://static.line-scdn.net/liff/edge/2/sdk.js';
 sdk.onload=()=>liff.init({liffId:LIFF_ID}).then(resolve,reject);
 sdk.onerror=()=>reject(new Error('Unable to load LINE. Please close and reopen.'));
 document.head.appendChild(sdk);
});
ready.catch(e=>{status.textContent=e.message||String(e);});
</script></body></html>
